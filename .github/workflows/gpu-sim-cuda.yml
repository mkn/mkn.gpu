name: GPU Simulator CUDA

# Experimental: the cuda profile on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim), built with nvcc and with clang.
# The simulator needs a shared cudart.

# Runs on master too: a cache saved by a pull request is only visible to that pull request,
#  one saved on master is visible to all of them, so the simulator is built once rather than
#  per pull request. The weekly run keeps the cache from expiring (7 days unused).
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest

jobs:
  cuda:
    name: cuda profile (${{ matrix.cc }}, CUDA 12.6, simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [nvcc, clang]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA
        # pantheonsim fork: cudaFuncGetAttributes thread limit fix, until it is upstream
        uses: PhilipDeegan/pantheonsim@be4ba8a98795fbee4055fefa3a1294d28ea563fd
        with:
          gpu: nvidia/h100
          cuda-toolkit: "12.6"
          rocm: none

      - name: Get mkn
        run: |
          $CURL_GET -o mkn ${PATH_GET}/mkn_nix
          chmod +x mkn
          nvcc --version
          clang++ --version

      - name: Build and test (nvcc)
        if: matrix.cc == 'nvcc'
        run: |
          # no -O/-W: maiken treats nvcc as gcc, nvcc rejects gcc's optimise/warning flags
          KLOG=3 vgpu run ./mkn clean build test run -dtp cuda -x res/mkn/nvcc \
            -a "-arch=sm_90 -O3" -l "-cudart shared"

      # clang_cuda.yaml defaults to sm_120, which needs CUDA >= 12.8. clang 18, the runner's
      #  default, fails on libstdc++ 14's __float128 in device code, clang 19 does not
      - name: Build and test (clang)
        if: matrix.cc == 'clang'
        run: |
          sudo apt-get install -y -qq --no-install-recommends clang-19
          sed -e 's/sm.arch: 120/sm.arch: 90/' -e 's/clang++ /clang++-19 /g' \
            res/mkn/clang_cuda.yaml > res/mkn/clang_cuda_ci.yaml
          KLOG=3 vgpu run ./mkn clean build test run -dtOp cuda -x res/mkn/clang_cuda_ci \
            -l "--cudart=shared" -W 9
