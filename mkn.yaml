#! clean build test run -tOqp rocm -x res/mkn/hipcc -W

name: mkn.gpu
parent: headers

profile:
- name: headers
  inc: inc
  dep: mkn.kul

- name: rocm
  parent: headers
  arg: -DMKN_GPU_ROCM=1
  # main: tst/any/managed.cpp
  test: tst/any/(\w).cpp
        tst/hip/(\w).cpp

- name: cuda
  parent: headers
  arg: -DMKN_GPU_CUDA=1
  # main: tst/any/managed.cpp
  test: tst/any/(\w).cpp
        tst/cuda/(\w).cpp

# if you have no GPU but want to test your code
- name: cpu
  parent: headers
  # main: tst/any/class1.cpp
  arg: -DMKN_GPU_CPU=1
  test: tst/any/(\w).cpp
        tst/cpu/(\w).cpp

- name: mem_test
  parent: headers
  main: tst/mem/test_alloc.cpp

- name: format
  mod: |
    clang.format{init{style: file, paths: inc test}}
